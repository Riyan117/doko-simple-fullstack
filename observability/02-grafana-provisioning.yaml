# Grafana INI TERPISAH dari grafana/ (docker-compose) yang sudah ada — bukan
# menggantikan. Grafana docker-compose tetap untuk dashboard k6/InfluxDB saat
# latihan lokal tanpa k3d. Grafana di k8s ini isinya cuma datasource
# Prometheus_App (metrik SLO app), sesuai pembagian peran yang sudah disepakati:
# InfluxDB+k6 = docker-compose, Prometheus+app metrics = k8s.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: doko
data:
  prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus_App
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: doko
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: 'App Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app
  namespace: doko
data:
  app-slo.json: |
    {
      "title": "App SLO - Backend",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request Rate (req/s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m]))",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "100 * (sum(rate(http_requests_total{status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(http_requests_total[5m]))",
              "legendFormat": "error %"
            }
          ]
        },
        {
          "id": 3,
          "title": "Latency p50 / p95 / p99 (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p99"
            }
          ]
        }
      ]
    }
