# CATATAN soal Secret ini:
# (a) Kredensial sama persis dengan docker-compose.yml (user/password/app_db) —
#     ini creds disposable yang memang sudah publik/terbaca di repo, bukan
#     rahasia sungguhan. Aman dipakai apa adanya untuk latihan lokal di k3d.
# (b) k8s Secret HANYA base64-encode, BUKAN enkripsi — siapa pun yang punya
#     akses `kubectl get secret -o yaml` atau akses ke etcd bisa membacanya
#     mentah-mentah. Jangan anggap ini "aman" untuk kredensial produksi.
# (c) Untuk setup GitOps nyata (rencana Fase 6, bareng ArgoCD), ini akan
#     diganti Sealed Secrets atau SOPS supaya manifest terenkripsi aman
#     di-commit ke git. Ditunda ke Fase 6, bukan sekarang.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: doko
type: Opaque
stringData:
  POSTGRES_USER: user
  POSTGRES_PASSWORD: password
  POSTGRES_DB: app_db
