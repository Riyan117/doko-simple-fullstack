apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: doko
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: doko
spec:
  replicas: 1
  # Postgres single-instance tidak boleh Recreate->RollingUpdate paralel karena
  # PVC-nya ReadWriteOnce (hanya bisa dipakai 1 pod). Recreate = pod lama mati
  # dulu sebelum pod baru naik, aman untuk data.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:13-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          volumeMounts:
            # subPath "pgdata" supaya direktori data tidak langsung di root
            # volume (menghindari isu lost+found bawaan beberapa storage class).
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: doko
spec:
  # Tidak ada "type:" -> default ClusterIP, tidak ada NodePort/LoadBalancer.
  # Ini yang membuat Postgres TIDAK bisa diakses dari luar cluster.
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
