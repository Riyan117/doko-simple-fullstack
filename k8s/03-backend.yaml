apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: doko
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # Backend tidak pernah panggil Kubernetes API — token ServiceAccount
      # default tidak perlu di-mount.
      automountServiceAccountToken: false
      containers:
        - name: backend
          # Image dibangun lokal lalu di-import ke k3d (lihat k8s/README.md).
          # imagePullPolicy: IfNotPresent wajib, kalau tidak k3s akan coba
          # pull dari registry publik dan gagal (image ini tidak dipublish).
          image: doko-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # "db" = nama Service Postgres (02-postgres.yaml), resolvable via
            # DNS internal cluster karena satu namespace. server.js sudah baca
            # dari env ini, jadi tidak perlu ubah kode apa pun.
            - name: DB_HOST
              value: db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          # Resource request/limit ringan — target akhir STB arm64. Request =
          # jaminan minimum buat scheduler & basis HPA; limit mencegah satu
          # pod menghabiskan node kalau ada lonjakan/bug.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Liveness TIDAK cek DB (lihat komentar di server.js) — cuma
          # memastikan proses Express masih hidup. initialDelaySeconds diberi
          # sedikit waktu karena Bun perlu start dulu sebelum listen.
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # Readiness cek DB sudah konek (dbReady). Kalau belum, pod ditahan
          # dari Service endpoints (tidak dikirimi trafik) TANPA direstart —
          # ini yang menggantikan perilaku crash-loop lama.
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: doko
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
